<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realtime Private Limited</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f8ff;
  color:#172033;
  line-height:1.6;
}

header{
  background:#0756b8;
  color:white;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  font-size:16px;
}

.hero{
  background:linear-gradient(135deg,#0756b8,#08a8ff);
  color:white;
  text-align:center;
  padding:80px 20px;
}

.hero h1{
  font-size:42px;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  max-width:700px;
  margin:auto;
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:13px 25px;
  background:white;
  color:#0756b8;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

section{
  padding:55px 7%;
}

.title{
  text-align:center;
  margin-bottom:35px;
}

.title h2{
  color:#0756b8;
  font-size:32px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.product{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  text-align:center;
}

.product h3{
  color:#0756b8;
  margin-bottom:10px;
}

.about
